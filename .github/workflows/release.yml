name: Build and release plugin

# Runs on every push to main (i.e. every merged PR). Releases only when the
# Version header in website-builder-blocks.php has been bumped to a version
# that has no tag yet:
#
#   - version unchanged (already tagged)   -> skip, no release
#   - version bumped above the latest tag  -> build, tag, release
#   - version untagged but not the highest -> fail
#
# The release gets a zip of the plugin with compiled assets and dev-only
# files stripped out. See README.md for how to pull it with Composer.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0 # needed for tags

      - name: Decide whether to release
        id: version
        run: |
          VERSION=$(grep -m1 -oP 'Version:\s*\K\S+' website-builder-blocks.php)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version header '$VERSION' is not in X.Y.Z format."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists; nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Only strict X.Y.Z tags count as releases (ignores preview-* tags).
          LATEST=$(git tag -l | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1)
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          if [ -n "$LATEST" ]; then
            HIGHEST=$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -n1)
            if [ "$HIGHEST" != "$VERSION" ]; then
              echo "::error::Version $VERSION is lower than the latest tag $LATEST. Bump the Version header above $LATEST."
              exit 1
            fi
          fi

          echo "Releasing $VERSION (previous: ${LATEST:-none})."
          echo "release=true" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: steps.version.outputs.release == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      # Node 22 ships npm 10, but package-lock.json is written by npm 11,
      # which npm 10's `npm ci` rejects as out of sync.
      - name: Use npm 11
        if: steps.version.outputs.release == 'true'
        run: npm install -g npm@11

      - name: Install dependencies
        if: steps.version.outputs.release == 'true'
        run: npm ci --no-audit --no-fund

      # postbuild runs verify:assets, which checks the script handles.
      - name: Build assets
        if: steps.version.outputs.release == 'true'
        run: npm run build

      - name: Assemble release package
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          PKG_DIR="dist/website-builder-blocks"
          mkdir -p "$PKG_DIR"
          rsync -a --exclude='scss/' build assets languages "$PKG_DIR/"
          # Only the PHP in src/ is used at runtime; everything else there
          # is build input and ends up compiled or copied into build/.
          rsync -a --prune-empty-dirs \
            --include='*/' --include='*.php' --exclude='*' \
            src "$PKG_DIR/"
          cp website-builder-blocks.php composer.json README.md "$PKG_DIR/"
          (cd dist && zip -rq "../website-builder-blocks-${VERSION}.zip" website-builder-blocks)
          unzip -l "website-builder-blocks-${VERSION}.zip" | tail -n1

      - name: Create GitHub release
        if: steps.version.outputs.release == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: website-builder-blocks-${{ steps.version.outputs.version }}.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
          # Compare against the last real release, never a preview.
          previous_tag: ${{ steps.version.outputs.latest }}
